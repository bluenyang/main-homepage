<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('darkMode');
          var dark =
            stored !== null
              ? stored === 'true'
              : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/bluenyang.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlueNyang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jua&family=Pacifico&family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
  </head>
  <body class="bg-background text-foreground font-sans antialiased transition-colors duration-300">
    <div id="app" class="relative h-full w-full"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
